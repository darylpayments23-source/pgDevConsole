<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - PostgreSQL Deployment Console</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6f8;min-height:100vh}.navbar-brand{font-weight:700}.card{box-shadow:0 2px 10px #0000000b}
.login-wrap{max-width:400px;margin:8vh auto 0;padding:0 16px}
</style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid"><span class="navbar-brand">PostgreSQL SQL Deployment Console</span></div>
</nav>

<div class="login-wrap">
<div class="card p-4">
<h5 class="mb-3">Sign in</h5>
<div id="notice"></div>
<form id="loginForm" novalidate>
<div class="mb-3"><label class="form-label" for="username">Username</label>
<input id="username" class="form-control" autocomplete="username" autofocus required></div>
<div class="mb-3"><label class="form-label" for="password">Password</label>
<input id="password" type="password" class="form-control" autocomplete="current-password" required></div>
<div id="loginError" class="mb-3"></div>
<button id="loginBtn" type="submit" class="btn btn-primary w-100">Sign in</button>
</form>
<div class="text-center mt-3"><a href="#" id="forgotLink" class="small">Forgot password?</a></div>

<form id="forgotForm" class="mt-3 d-none" novalidate>
<hr>
<p class="small text-muted mb-2">Your administrator will be notified and will give you a temporary password.</p>
<div class="input-group">
<input id="forgotUsername" class="form-control" placeholder="Your username" autocomplete="username">
<button class="btn btn-outline-secondary" type="submit">Notify admin</button>
</div>
<div id="forgotMsg" class="mt-2"></div>
</form>
</div>
</div>

<!-- Forced password change (first login / after an admin reset). Cannot be dismissed. -->
<div class="modal fade" id="forceModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="forceTitle" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered"><div class="modal-content">
<form id="forceForm" novalidate>
<div class="modal-header"><h5 class="modal-title" id="forceTitle">Change your password</h5></div>
<div class="modal-body">
<p class="small text-muted">You signed in with a temporary password. Choose a new password to continue.</p>
<div class="mb-3"><label class="form-label" for="newPassword">New password</label>
<input id="newPassword" type="password" class="form-control" autocomplete="new-password" required>
<div class="form-text" id="pwHint">At least 8 characters.</div></div>
<div class="mb-3"><label class="form-label" for="confirmPassword">Confirm new password</label>
<input id="confirmPassword" type="password" class="form-control" autocomplete="new-password" required></div>
<div id="forceError"></div>
</div>
<div class="modal-footer">
<button type="button" class="btn btn-link me-auto" id="forceCancel">Sign out</button>
<button type="submit" class="btn btn-primary" id="forceBtn">Change password</button>
</div>
</form>
</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
// JWT is kept in sessionStorage (not localStorage): it is dropped when the tab closes and is not shared across tabs.
const TOKEN_KEY='pgdep.token';
const $=id=>document.getElementById(id);
const getToken=()=>{try{return sessionStorage.getItem(TOKEN_KEY)}catch(e){return null}};
const setToken=t=>{try{sessionStorage.setItem(TOKEN_KEY,t)}catch(e){}};
const clearToken=()=>{try{sessionStorage.removeItem(TOKEN_KEY)}catch(e){}};
let forceModal=null, minLen=8;

function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function alertBox(kind,msg){return '<div class="alert alert-'+kind+' py-2 small mb-0">'+esc(msg)+'</div>'}
async function readError(r){
 try{const b=await r.json();return b.message||b.error||('HTTP '+r.status)}catch(e){return 'HTTP '+r.status}
}
function goConsole(){location.replace('/')}

function showForceChange(){
 $('pwHint').textContent='At least '+minLen+' characters.';
 $('forceError').innerHTML=''; $('newPassword').value=''; $('confirmPassword').value='';
 forceModal=forceModal||new bootstrap.Modal($('forceModal'));
 forceModal.show();
 setTimeout(()=>$('newPassword').focus(),300);
}

// Already signed in (e.g. redirected here from the console because a password change is required)?
async function checkExisting(){
 const p=new URLSearchParams(location.search);
 if(p.has('expired'))$('notice').innerHTML='<div class="mb-3">'+alertBox('warning','Your session has expired. Please sign in again.')+'</div>';
 if(p.has('loggedout'))$('notice').innerHTML='<div class="mb-3">'+alertBox('success','You have been signed out.')+'</div>';
 const t=getToken(); if(!t)return;
 try{
  const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+t}});
  if(!r.ok){clearToken();return}
  const me=await r.json(); minLen=me.minPasswordLength||minLen;
  if(me.mustChangePassword)showForceChange(); else goConsole();
 }catch(e){}
}

$('loginForm').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const username=$('username').value.trim(), password=$('password').value;
 if(!username||!password){$('loginError').innerHTML=alertBox('danger','Enter your username and password.');return}
 $('loginBtn').disabled=true; $('loginError').innerHTML='';
 try{
  const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
  if(!r.ok){$('loginError').innerHTML=alertBox('danger',await readError(r));$('password').value='';$('password').focus();return}
  const d=await r.json(); setToken(d.token); $('password').value='';
  if(d.mustChangePassword){
   try{const me=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+d.token}}).then(x=>x.json());minLen=me.minPasswordLength||minLen}catch(e){}
   showForceChange();
  } else goConsole();
 }catch(e){$('loginError').innerHTML=alertBox('danger','Cannot reach the server.')}
 finally{$('loginBtn').disabled=false}
});

$('forceForm').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const np=$('newPassword').value, cp=$('confirmPassword').value;
 if(np.length<minLen){$('forceError').innerHTML=alertBox('danger','Password must be at least '+minLen+' characters.');return}
 if(np!==cp){$('forceError').innerHTML=alertBox('danger','The passwords do not match.');return}
 $('forceBtn').disabled=true; $('forceError').innerHTML='';
 try{
  const r=await fetch('/api/auth/change-password',{method:'POST',
   headers:{'Content-Type':'application/json',Authorization:'Bearer '+getToken()},
   body:JSON.stringify({newPassword:np})});
  if(r.status===401){clearToken();forceModal.hide();$('notice').innerHTML='<div class="mb-3">'+alertBox('warning','Your session has expired. Please sign in again.')+'</div>';return}
  if(!r.ok){$('forceError').innerHTML=alertBox('danger',await readError(r));return}
  const d=await r.json(); setToken(d.token);   // the change ends the old session; continue with the new token
  goConsole();
 }catch(e){$('forceError').innerHTML=alertBox('danger','Cannot reach the server.')}
 finally{$('forceBtn').disabled=false}
});

$('forceCancel').addEventListener('click',async()=>{
 const t=getToken(); clearToken();
 if(t){try{await fetch('/api/auth/logout',{method:'POST',headers:{Authorization:'Bearer '+t}})}catch(e){}}
 forceModal.hide();
});

$('forgotLink').addEventListener('click',ev=>{
 ev.preventDefault(); $('forgotForm').classList.toggle('d-none');
 $('forgotUsername').value=$('username').value.trim(); $('forgotUsername').focus();
});
$('forgotForm').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const username=$('forgotUsername').value.trim();
 if(!username){$('forgotMsg').innerHTML=alertBox('danger','Enter your username.');return}
 try{
  const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});
  const d=await r.json().catch(()=>({}));
  $('forgotMsg').innerHTML=alertBox(r.ok?'info':'danger',d.message||'Request sent.');
 }catch(e){$('forgotMsg').innerHTML=alertBox('danger','Cannot reach the server.')}
});

checkExisting();
</script>
</body>
</html>
