<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PostgreSQL Deployment Console</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f4f6f8}.navbar-brand{font-weight:700}.card{box-shadow:0 2px 10px #0000000b}
.status{font-weight:700}.log{background:#10151b;color:#d7e2ea;height:180px;overflow:auto;font-family:monospace;font-size:13px}
.progress{height:24px}.clickable{cursor:pointer}
.log .warn{color:#ffc107}.cksum{font-size:11px;color:#6c757d}
body.auth-pending .container-fluid.py-4{visibility:hidden}
.temp-pw{font-family:monospace;font-size:1.1rem;letter-spacing:.05em}
#history tr.hist-row{cursor:pointer}
#history tr.hist-row:focus-visible{outline:2px solid #0d6efd;outline-offset:-2px}
.dd-meta dt{font-weight:600;color:#6c757d;font-size:.8rem;text-transform:uppercase;letter-spacing:.03em}
.dd-meta dd{margin-bottom:.6rem}
.dd-err{white-space:pre-wrap;word-break:break-word;font-family:monospace;font-size:12px;margin:0;
  background:#fff5f5;border:1px solid #f1c0c0;border-radius:4px;padding:.4rem .5rem;max-height:240px;overflow:auto}
#ddScripts tr.dd-failed>td{background:#fde8e8}
#ddScripts td{vertical-align:top}
.text-bg-orange{background:#fd7e14!important;color:#fff!important}
</style>

<body class="auth-pending">
<nav class="navbar navbar-dark bg-dark">
<div class="container-fluid flex-wrap gap-2"><span class="navbar-brand">PostgreSQL SQL Deployment Console</span>
<div class="d-flex align-items-center flex-wrap gap-2">
<span class="text-light small" id="whoami"></span>
<button id="usersBtn" class="btn btn-sm btn-outline-light d-none" onclick="openUsers()">Users</button>
<button class="btn btn-sm btn-outline-light" onclick="openSettings()">Change Password</button>

<div class="container-fluid py-4">
<div class="row g-4">
<div class="col-lg-4">
<div class="card p-4">
<h5>Deployment</h5>
<div class="mb-3"><label class="form-label">SQL Folder</label>
<div class="input-group"><input id="folder" class="form-control" placeholder="C:\deploy\release-001">
<button class="btn btn-outline-primary" onclick="scan()">Scan</button></div></div>

<div class="mb-3"><label class="form-label">Database</label>
<select id="env" class="form-select" onchange="environmentChanged()"></select>
<div id="dbUrl" class="form-text"></div></div>

<div class="mb-3"><label class="form-label">Transaction</label>
<select id="commitMode" class="form-select">
<option value="script">Commit after each script</option>
<option value="all">Commit all scripts</option>
</select></div>

<div class="d-flex gap-2">
<button id="executeBtn" class="btn btn-primary" onclick="deploy()" disabled>Execute Scripts</button>
<button class="btn btn-outline-secondary" onclick="loadHistory()">History</button>
</div>
<div id="roleNote" class="form-text"></div>
<div id="lockBanner" class="mt-3"></div>
<div id="message" class="mt-3"></div>
</div>

<div class="card p-4 mt-4">
<h5>Deployment Log</h5>
<div id="log" class="log p-3"></div>
</div>
</div>

<div class="card p-4">
<div class="d-flex justify-content-between align-items-center">

</div>

<thead><tr><th>#</th><th>SQL Script</th><th>Status</th><th>Duration</th><th>Error</th></tr></thead>

</table></div>
</div>

<div class="d-flex justify-content-between"><h5>Execution History</h5>

<select id="hEnv" class="form-select form-select-sm">
<option value="">All</option><option value="dev">DEV</option><option value="uat">UAT</option><option value="prod">PROD</option>
</select></div>
<div class="col-6 col-md-2"><label class="form-label small mb-1" for="hStatus">Status</label>
<select id="hStatus" class="form-select form-select-sm">
<option value="">All</option><option>SUCCESS</option><option>FAILED</option><option>RUNNING</option>
</select></div>
<div class="col-12 col-md-2"><label class="form-label small mb-1" for="hUser">Deployed by</label>
<input id="hUser" class="form-control form-control-sm" placeholder="username" autocomplete="off"></div>

<button type="submit" class="btn btn-sm btn-primary flex-fill">Apply</button>

</form>
<div id="historyMsg"></div>
<div class="table-responsive"><table class="table table-sm table-hover"><thead>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="none">
const KEY='pgdep.deploymentId';
let currentId=null, es=null, envs=[], lastLogged=null, lockEndsAt=null, lockInfo=null, lockEnv=null, lockTimer=null, warned=new Set();
const isDone=st=>st==='SUCCESS'||st==='FAILED';
const $=id=>document.getElementById(id);
function log(s,cls){$('log').innerHTML += (cls?'<span class="'+cls+'">':'')+new Date().toLocaleTimeString()+"  "+s+(cls?'</span>':'')+"<br>";$('log').scrollTop=$('log').scrollHeight}
// Logs each modified script once per scan/deployment.
function warnModified(data){
 for(const x of data){
  if(!x.modified)continue; const k=x.path+'|'+x.checksum; if(warned.has(k))continue; warned.add(k);
  log('\u26A0\uFE0F Script '+esc(x.path)+' has changed since last execution','warn');
 }
}
async function init(){
 if(!await authenticate())return;
 envs=await api('/api/environments').then(r=>r.json());
 $('env').innerHTML=envs.map(x=>`<option value="${x.key}">${x.name}</option>`).join('');
 $('histFilters').addEventListener('submit',e=>{e.preventDefault();applyHistoryFilters()});
 $('history').addEventListener('click',e=>{const tr=e.target.closest('tr.hist-row');if(tr)openDetail(tr.dataset.id)});
 $('history').addEventListener('keydown',e=>{const tr=e.target.closest('tr.hist-row');
  if(tr&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDetail(tr.dataset.id)}});
 environmentChanged(); loadHistory();
 await restore();
 refreshLock(); setInterval(refreshLock,10000);
}
function environmentChanged(){
 const e=envs.find(x=>x.key===$('env').value); $('dbUrl').textContent=e?e.url:'';
 refreshLock();
}
async function scan(){
 const folder=$('folder').value.trim(); if(!folder){alert('Enter the SQL folder.');return}
 log('Scanning '+folder+' ...'); warned.clear();
 try{
  const data=await api('/api/scan?folder='+encodeURIComponent(folder)+'&environment='+encodeURIComponent($('env').value),{method:'POST'}).then(async r=>{if(!r.ok)throw new Error(await r.text());return r.json()});
  render(data); setExecEnabled(data.length>0); log('Found '+data.length+' SQL script(s).'); const nMod=data.filter(x=>x.modified).length; if(nMod)log('Warning: '+nMod+' script(s) changed since last successful execution in '+$('env').value.toUpperCase()+'.','warn');
 }catch(e){if(!redirecting){showError(e.message);log('SCAN FAILED: '+e.message)}}
}
function render(data){
 $('scripts').innerHTML=data.map(x=>`<tr id="row-${x.order}">
<td>${x.order}</td><td><code>${esc(x.path)}</code>${x.checksum?`<div class="cksum" title="SHA-256: ${esc(x.checksum)}">sha256 ${esc(x.checksum.substring(0,12))}&hellip;</div>`:''}</td>
<td class="status">${badge(x.status)}${modBadge(x)}</td><td>${x.durationMs??'-'}${x.durationMs?' ms':''}</td>
<td class="text-danger small">${esc(x.error||'')}</td></tr>`).join('');
 updateProgress(data); warnModified(data);
}
function modBadge(x){
 return x.modified?` <span class="badge text-bg-warning" title="Checksum differs from the last successful execution">&#9888; MODIFIED</span>`:'';
}
function badge(s){
 let cls={PENDING:'secondary',RUNNING:'warning',SUCCESS:'success',FAILED:'danger',SKIPPED:'info',CANCELLED:'dark'}[s]||'secondary';
 return `<span class="badge text-bg-${cls}">${s}</span>`;
}
function updateProgress(data){
 const done=data.filter(x=>['SUCCESS','FAILED','SKIPPED','CANCELLED'].includes(x.status)).length;
 const pct=data.length?Math.round(done*100/data.length):0;
 $('progress').style.width=pct+'%';$('progress').textContent=pct+'%';
}
async function deploy(confirmModified){
 const confirmed=confirmModified===true;
 if(!confirmed&&!confirm('Execute the scripts against '+$('env').value.toUpperCase()+'?'))return;
 const req={folder:$('folder').value,environment:$('env').value,commitMode:$('commitMode').value,confirmModified:confirmed};
 setExecEnabled(false); log('Starting deployment...'); warned.clear();
 try{
  const res=await api('/api/deploy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req)});
  if(res.status===409){
   const b=await res.json().catch(()=>({}));
   if(b.error==='SCRIPTS_MODIFIED'){
    const list=b.modifiedScripts||[];
    list.forEach(p=>log('\u26A0\uFE0F Script '+esc(p)+' has changed since last execution','warn'));
    setExecEnabled(true);
    if(confirm('\u26A0\uFE0F '+list.length+' script(s) have changed since their last successful execution:\n\n'+list.join('\n')+'\n\nDeploy the modified scripts to '+req.environment.toUpperCase()+' anyway?')){
     log('Modified scripts confirmed by operator.'); return deploy(true);
    }
    log('Deployment cancelled: modified scripts were not confirmed.'); scan(); return;
   }
   $('message').innerHTML='';
   showLock(b.lock,req.environment,b.message);
   log('DEPLOYMENT BLOCKED: '+(b.message||'environment is locked'));
   setExecEnabled(true); return;
  }
  if(res.status===403){const b=await res.json().catch(()=>({}));throw new Error(b.message||'Not allowed.')}
  if(!res.ok)throw new Error(await res.text());
  $('message').innerHTML='';
  const d=await res.json(); currentId=d.id; lastLogged=null; remember(currentId); log('Deployment ID: '+currentId+' (started by '+me.username+')');
  listen(currentId);
 }catch(e){if(!redirecting){showError(e.message);setExecEnabled(true)}}
}
function remember(id){try{localStorage.setItem(KEY,id)}catch(e){}}
function forget(){try{localStorage.removeItem(KEY)}catch(e){} currentId=null}
function applyState(s){
 render(s.scripts); $('overall').textContent=s.status;
 $('overall').className='badge '+(s.status==='SUCCESS'?'text-bg-success':s.status==='FAILED'?'text-bg-danger':'text-bg-warning');
 const cur=s.scripts.find(x=>x.status==='RUNNING');
 if(cur&&cur.path!==lastLogged){lastLogged=cur.path;log('RUNNING: '+cur.path)}
}
function onFinished(s,enableButton){
 if(es){es.close();es=null}
 if(enableButton)setExecEnabled(true);
 setTimeout(()=>loadHistory(0),700);   // history row is written just after the final status is published; show newest
 log('Deployment '+s.status+'.'); if(s.error)log('ERROR: '+s.error);
}
// Server-Sent Events read through fetch(), because EventSource cannot send the Authorization header.
// `es` is a handle with close(), like the EventSource it replaces.
function listen(id){
 if(es)es.close();
 const ctl=new AbortController(); let closed=false;
 const handle={close(){closed=true;ctl.abort()}}; es=handle;
 const dispatch=block=>{
  let event='message'; const data=[];
  for(const line of block.split('\n')){
   if(!line||line.startsWith(':'))continue;
   const k=line.indexOf(':'), field=k<0?line:line.slice(0,k);
   let v=k<0?'':line.slice(k+1); if(v.startsWith(' '))v=v.slice(1);
   if(field==='event')event=v; else if(field==='data')data.push(v);
  }
  if(event!=='status'||!data.length)return;
  const s=JSON.parse(data.join('\n')); applyState(s);
  if(isDone(s.status))onFinished(s,true);
 };
 (async()=>{
  try{
   const r=await api('/api/deploy/'+id+'/events',{headers:{Accept:'text/event-stream'},signal:ctl.signal});
   if(!r.ok)throw new Error('HTTP '+r.status);
   const reader=r.body.getReader(), dec=new TextDecoder(); let buf='';
   for(;;){
    const {value,done}=await reader.read(); if(done)break;
    buf=(buf+dec.decode(value,{stream:true})).replace(/\r\n?/g,'\n');
    let i; while(!closed&&(i=buf.indexOf('\n\n'))>=0){dispatch(buf.slice(0,i));buf=buf.slice(i+2)}
   }
  }catch(e){}
  if(closed||redirecting||es!==handle)return;
  es=null; setTimeout(()=>resume(id),3000);   // connection dropped: re-attach
 })();
}
async function resume(id){
 if(id!==currentId)return;
 try{
  const r=await api('/api/deploy/'+id);
  if(r.status===404){forget();setExecEnabled(true);return}
  if(!r.ok)throw new Error('HTTP '+r.status);
  const s=await r.json(); applyState(s);
  if(isDone(s.status))onFinished(s,true); else listen(id);
 }catch(e){if(!redirecting)setTimeout(()=>resume(id),3000)}
}
// Re-attach after a page refresh: prefer whatever is running on the server, else show the last deployment seen by this browser.
async function restore(){
 let id=null;
 try{const r=await api('/api/deploy/active'); if(r.status===200)id=(await r.json()).id}catch(e){}
 if(!id){try{id=localStorage.getItem(KEY)}catch(e){}}
 if(!id)return;
 try{
  const r=await api('/api/deploy/'+id);
  if(!r.ok){forget();return}
  const s=await r.json();
  currentId=id; remember(id);
  $('folder').value=s.folder||'';
  const envKey=String(s.environment||'').toLowerCase();
  if([...$('env').options].some(o=>o.value===envKey))$('env').value=envKey;
  environmentChanged();
  $('commitMode').value=s.commitMode==='all'?'all':'script';
  applyState(s);
  log('Restored deployment '+id+' ('+s.status+').');
  if(isDone(s.status)){ if(s.error)log('ERROR: '+s.error); }
  else{ setExecEnabled(false); listen(id); }
 }catch(e){}
}
function fmtCountdown(sec){
 sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60), r=sec%60;
 return m+':'+String(r).padStart(2,'0');
}
// Shows (or clears) the lock banner. info = {deploymentId, remainingSeconds, lockedUntil} or null.
function showLock(info,envKey,message){
 if(lockTimer){clearInterval(lockTimer);lockTimer=null}
 lockInfo=info||null; lockEnv=envKey||null;
 const box=$('lockBanner');
 if(!info&&!message){box.innerHTML='';lockEndsAt=null;return}
 const name=String(envKey||'').toUpperCase();
 if(!info){
  box.innerHTML='<div class="alert alert-danger mb-0"><strong>&#128274; '+esc(name)+' is locked</strong><div class="small">'+esc(message)+'</div></div>';
  return;
 }
 lockEndsAt=Date.now()+info.remainingSeconds*1000;   // server-computed remaining time, immune to browser clock skew
 box.innerHTML='<div class="alert alert-danger mb-0"><strong>&#128274; '+esc(name)+' is locked by '+(info.deploymentId===currentId?'your running deployment':'another deployment')+'</strong>'
  +'<div class="small mt-1">Lock holder: <code>'+esc(info.deploymentId)+'</code></div>'
  +'<div class="small">Auto-expires in <strong id="lockCountdown"></strong>'
  +(info.lockedUntil?' (at '+esc(new Date(info.lockedUntil).toLocaleTimeString())+')':'')+'</div></div>';
 tickLock(); lockTimer=setInterval(tickLock,1000);
}
function tickLock(){
 const left=(lockEndsAt-Date.now())/1000, el=$('lockCountdown');
 if(left<=0){
  if(lockTimer){clearInterval(lockTimer);lockTimer=null}
  $('lockBanner').innerHTML='<div class="alert alert-warning mb-0">Lock expired &mdash; you can retry the deployment.</div>';
  setTimeout(refreshLock,1500); return;
 }
 if(el)el.textContent=fmtCountdown(left);
}
// Polls the server for the selected environment's lock holder.
async function refreshLock(){
 const env=$('env').value; if(!env)return;
 try{
  const r=await api('/api/deploy/'+encodeURIComponent(env)+'/lock-status');
  if(!r.ok)return;
  const s=await r.json();
  if($('env').value!==env)return;   // user switched environment while the request was in flight
  if(s.locked){
   // keep the running countdown if it's the same lock; otherwise (re)draw
   if(!(lockInfo&&lockEnv===env&&lockInfo.deploymentId===s.lock.deploymentId))showLock(s.lock,env);
   else lockEndsAt=Date.now()+s.lock.remainingSeconds*1000;
  } else if(lockInfo||$('lockBanner').innerHTML){ showLock(null,env); }
 }catch(e){}
}
// History paging/filter state. Filters take effect on Apply; Refresh re-reads the current page with them.
const hist={page:0,size:25,filters:{},totalPages:0};
function readHistoryFilters(){
 return {environment:$('hEnv').value,status:$('hStatus').value,deployedBy:$('hUser').value.trim(),
         from:$('hFrom').value,to:$('hTo').value};
}
function applyHistoryFilters(){
 const f=readHistoryFilters();
 if(f.from&&f.to&&f.from>f.to){$('historyMsg').innerHTML='<div class="alert alert-warning py-1 small">"From" must not be after "To".</div>';return}
 hist.filters=f; hist.page=0; loadHistory();
}
function clearHistoryFilters(){
 $('histFilters').reset(); hist.filters={}; hist.page=0; loadHistory();
}
function historyPage(delta){
 const p=hist.page+delta; if(p<0||(hist.totalPages&&p>=hist.totalPages))return;
 hist.page=p; loadHistory();
}
function historySizeChanged(){ hist.size=+$('hSize').value; hist.page=0; loadHistory(); }
// page: undefined = keep the current page (Refresh); 0 = jump to the newest deployments.
async function loadHistory(page){
 if(page!==undefined)hist.page=page;
 const qs=new URLSearchParams({page:hist.page,size:hist.size});
 for(const [k,v] of Object.entries(hist.filters))if(v)qs.set(k,v);
 try{
  const r=await api('/api/history?'+qs);
  const d=await r.json().catch(()=>({}));
  if(!r.ok){$('historyMsg').innerHTML='<div class="alert alert-danger py-1 small">'+esc(d.message||'Could not load history.')+'</div>';return}
  // The page may have emptied (e.g. filters changed elsewhere, rows removed): fall back to the last page.
  if(d.content.length===0&&d.totalElements>0&&hist.page>=d.totalPages){return loadHistory(d.totalPages-1)}
  $('historyMsg').innerHTML='';
  hist.totalPages=d.totalPages;
  $('history').innerHTML=d.content.length?d.content.map(x=>`<tr class="hist-row" data-id="${esc(x.id)}" tabindex="0" title="Show the scripts of this deployment">
<td>${esc(x.startedAt||'')}</td><td>${esc(x.environment)}</td><td>${esc(x.deployedBy||'-')}</td>
<td>${badge(x.status)}</td><td><span class="small" title="${esc(commitModeLabel(x.commitMode))}">${esc(x.commitMode==='all'?'All':'Per script')}</span></td>
<td>${x.total}</td><td>${x.successful}</td><td>${x.failed}</td></tr>`).join('')
   :'<tr><td colspan="8" class="text-center text-muted py-3">No deployments match these filters</td></tr>';
  $('hInfo').textContent=`Page ${d.totalPages?d.page+1:0} of ${d.totalPages} (${d.totalElements} deployment${d.totalElements===1?'':'s'})`;
  $('hPrev').disabled=d.page<=0;
  $('hNext').disabled=d.page+1>=d.totalPages;
 }catch(e){}
}
// ---------------------------------------------------------------------------
// Deployment details modal. Read-only: opening/closing it never touches the history page or filters,
// so Close returns to exactly the same list.
// ---------------------------------------------------------------------------
const detail={data:null,filter:'all'};
const OUTCOME={COMMITTED:['success','COMMITTED'],ROLLED_BACK:['orange','ROLLED BACK'],FAILED:['danger','FAILED'],
  NOT_RUN:['secondary','NOT RUN'],RUNNING:['warning','RUNNING'],PENDING_COMMIT:['info','PENDING COMMIT']};
const OUTCOME_HINT={COMMITTED:'Executed and committed',ROLLED_BACK:'Executed without error but rolled back because another script or the final commit failed',
  FAILED:'This script failed',NOT_RUN:'Never executed (skipped, cancelled or pending)',RUNNING:'Executing now',
  PENDING_COMMIT:'Executed; waiting for the final commit of this commit-all deployment'};
function commitModeLabel(m){return m==='all'?'Commit all scripts':'Commit after each script'}
function outcomeBadge(o){const [cls,txt]=OUTCOME[o]||['secondary',o||'?'];
 return `<span class="badge text-bg-${cls}" title="${esc(OUTCOME_HINT[o]||'')}">${esc(txt)}</span>`}
function fmtDuration(ms){
 if(ms==null)return '-'; if(ms<1000)return ms+' ms';
 const s=ms/1000; if(s<60)return s.toFixed(1)+' s';
 const m=Math.floor(s/60); return m+' min '+Math.round(s-m*60)+' s';
}
let detailModal=null;
async function openDetail(id){
 detail.data=null; detail.filter='all';
 $('detailBody').innerHTML='<div class="text-center text-muted py-4"><div class="spinner-border spinner-border-sm"></div> Loading&hellip;</div>';
 detailModal=detailModal||new bootstrap.Modal($('detailModal')); detailModal.show();
 try{
  const r=await api('/api/history/'+encodeURIComponent(id));
  const d=await r.json().catch(()=>({}));
  if(!r.ok){$('detailBody').innerHTML='<div class="alert alert-danger">'+esc(d.message||'Could not load the deployment.')+'</div>';return}
  detail.data=d; renderDetail();
 }catch(e){ if(!redirecting)$('detailBody').innerHTML='<div class="alert alert-danger">'+esc(e.message)+'</div>' }
}
function setDetailFilter(f){detail.filter=f; renderDetail()}
function renderDetail(){
 const d=detail.data; if(!d)return;
 const failedN=d.scripts.filter(x=>x.outcome==='FAILED').length;
 // Note: never write two opening square brackets in a row in this template: Thymeleaf treats them as an inline expression.
 const parts=[];
 parts.push([d.committed,'committed'],[d.rolledBack,'rolled back'],[failedN,'failed'],[d.skipped,'not run']);
 const running=d.scripts.filter(x=>x.outcome==='RUNNING').length, pend=d.scripts.filter(x=>x.outcome==='PENDING_COMMIT').length;
 if(running)parts.push([running,'running']); if(pend)parts.push([pend,'pending commit']);
 const summary=parts.map(([n,t])=>n+' '+t).join(' &middot; ');
 const shown=d.scripts.filter(x=>detail.filter==='failed'?x.outcome==='FAILED'
   :detail.filter==='notCommitted'?x.outcome!=='COMMITTED':true);
 const fbtn=(k,label)=>`<input type="radio" class="btn-check" name="ddFilter" id="ddf-${k}" ${detail.filter===k?'checked':''} onchange="setDetailFilter('${k}')">
<label class="btn btn-outline-secondary" for="ddf-${k}">${label}</label>`;
 $('detailTitle').innerHTML='Deployment details &mdash; '+esc(String(d.environment||'').toUpperCase())+' '+badge(esc(d.status));
 $('detailBody').innerHTML=`
<dl class="row dd-meta mb-2">
 <div class="col-6 col-md-3"><dt>Environment</dt><dd>${esc(d.environment)}</dd></div>
 <div class="col-6 col-md-3"><dt>Result</dt><dd>${badge(esc(d.status))}</dd></div>
 <div class="col-6 col-md-3"><dt>Commit mode</dt><dd>${esc(commitModeLabel(d.commitMode))}</dd></div>
 <div class="col-6 col-md-3"><dt>Deployed by</dt><dd>${esc(d.deployedBy||'-')}</dd></div>
 <div class="col-6 col-md-3"><dt>Started</dt><dd>${esc(fmtTime(d.startedAt))}</dd></div>
 <div class="col-6 col-md-3"><dt>Completed</dt><dd>${esc(d.completedAt?fmtTime(d.completedAt):(d.status==='RUNNING'||d.status==='PENDING'?'In progress':'-'))}</dd></div>
 <div class="col-6 col-md-3"><dt>Total duration</dt><dd>${esc(fmtDuration(d.durationMs))}</dd></div>
 <div class="col-6 col-md-3"><dt>Folder</dt><dd class="text-break"><code>${esc(d.folder)}</code></dd></div>
</dl>
${d.error?`<div class="alert alert-danger py-2"><strong>Deployment error</strong><pre class="dd-err mt-1 bg-transparent border-0 p-0">${esc(d.error)}</pre></div>`:''}
${d.rolledBack?`<div class="alert alert-warning py-2">&#9888; <strong>Commit-all mode:</strong> ${d.rolledBack} script${d.rolledBack===1?'':'s'} executed successfully but ${d.rolledBack===1?'was':'were'} rolled back because ${failedN?'a later script failed':'the final commit failed'}. No changes from this deployment were applied.</div>`:''}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
 <div class="small"><strong>${d.scripts.length}</strong> script${d.scripts.length===1?'':'s'}: ${summary}</div>
 <div class="btn-group btn-group-sm" role="group" aria-label="Filter scripts">${fbtn('all','All')}${fbtn('failed','Failed only')}${fbtn('notCommitted','Not committed')}</div>
</div>
<div class="table-responsive"><table class="table table-sm">
<thead><tr><th>#</th><th>Script</th><th>Outcome</th><th>Duration</th><th>Checksum</th><th style="min-width:280px">Error</th></tr></thead>
<tbody id="ddScripts">${shown.length?shown.map(x=>`<tr class="${x.outcome==='FAILED'?'dd-failed':''}">
<td>${esc(x.order)}</td>
<td><code>${esc(x.path)}</code></td>
<td>${outcomeBadge(x.outcome)}${x.status&&x.outcome!==x.status?`<div class="cksum" title="Stored script status">status ${esc(x.status)}</div>`:''}</td>
<td class="text-nowrap">${esc(fmtDuration(x.durationMs))}</td>
<td>${x.checksum?`<span class="cksum" title="SHA-256: ${esc(x.checksum)}">${esc(x.checksum.substring(0,12))}&hellip;</span>`:'<span class="text-muted">-</span>'}${x.checksumChanged?` <span class="badge text-bg-warning" title="Checksum differed from the last successful execution in this environment">&#9888; modified</span>`:''}</td>
<td>${x.error?`<pre class="dd-err">${esc(x.error)}</pre><button type="button" class="btn btn-link btn-sm p-0 mt-1" onclick="copyDetailError(${Number(x.order)},this)">Copy error</button>`:''}</td>
</tr>`).join(''):`<tr><td colspan="6" class="text-center text-muted py-3">No scripts match this filter</td></tr>`}</tbody>
</table></div>`;
}
async function copyDetailError(order,btn){
 const x=detail.data&&detail.data.scripts.find(s=>s.order===order); if(!x)return;
 try{ await navigator.clipboard.writeText(x.error||''); btn.textContent='Copied'; }
 catch(e){ btn.textContent='Copy failed'; }
 setTimeout(()=>{btn.textContent='Copy error'},1500);
}
function showError(x){$('message').innerHTML='<div class="alert alert-danger">'+esc(x)+'</div>'}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
// ---------------------------------------------------------------------------
// Authentication. The JWT lives in sessionStorage (not localStorage) and is sent as a Bearer header.
// ---------------------------------------------------------------------------
const TOKEN_KEY='pgdep.token';
let me=null, expiryTimer=null, redirecting=false;
function getToken(){try{return sessionStorage.getItem(TOKEN_KEY)}catch(e){return null}}
function setToken(t){try{sessionStorage.setItem(TOKEN_KEY,t)}catch(e){} scheduleExpiry(t)}
function clearToken(){try{sessionStorage.removeItem(TOKEN_KEY)}catch(e){}}
function toLogin(query){
 if(redirecting)return; redirecting=true;
 if(es){try{es.close()}catch(e){} es=null}
 location.replace('/login'+(query?'?'+query:''));
}
// fetch() with the token attached. Expired/invalid session -> login page; password change pending -> login page.
async function api(url,opts){
 opts=opts||{}; const t=getToken();
 if(!t){toLogin('expired');throw new Error('Not logged in')}
 const headers=Object.assign({},opts.headers||{},{Authorization:'Bearer '+t});
 const r=await fetch(url,Object.assign({},opts,{headers}));
 if(r.status===401){clearToken();toLogin('expired');throw new Error('Session expired')}
 if(r.status===403){
  const b=await r.clone().json().catch(()=>({}));
  if(b.error==='PASSWORD_CHANGE_REQUIRED'){toLogin();throw new Error(b.message)}
 }
 return r;
}
function tokenExpiry(t){
 try{const p=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));return p.exp?p.exp*1000:null}catch(e){return null}
}
// Redirect to the login page the moment the token expires, even if the page is idle.
function scheduleExpiry(t){
 if(expiryTimer)clearTimeout(expiryTimer);
 const exp=tokenExpiry(t); if(!exp)return;
 const ms=exp-Date.now();
 if(ms<=0){clearToken();toLogin('expired');return}
 expiryTimer=setTimeout(()=>{clearToken();toLogin('expired')},Math.min(ms,2147483000));
}
async function authenticate(){
 const t=getToken();
 if(!t){toLogin();return false}
 scheduleExpiry(t); if(redirecting)return false;
 try{
  const r=await api('/api/auth/me');
  if(!r.ok)throw new Error('HTTP '+r.status);
  me=await r.json();
 }catch(e){ if(!redirecting)toLogin('expired'); return false }
 if(me.mustChangePassword){toLogin();return false}
 $('whoami').innerHTML='Signed in as <strong>'+esc(me.username)+'</strong> <span class="badge text-bg-secondary">'+esc(me.role)+'</span>';
 $('usersBtn').classList.toggle('d-none',me.role!=='ADMIN');
 $('pwHint').textContent='At least '+(me.minPasswordLength||8)+' characters.';
 if(!canDeploy())$('roleNote').textContent='Your role ('+me.role+') is read-only: you can scan and follow deployments but not execute them.';
 document.body.classList.remove('auth-pending');
 return true;
}
const canDeploy=()=>!!me&&(me.role==='ADMIN'||me.role==='DEPLOYER');
function setExecEnabled(on){$('executeBtn').disabled=!(on&&canDeploy())}
async function logout(){
 try{await api('/api/auth/logout',{method:'POST'})}catch(e){}
 clearToken(); redirecting=false; toLogin('loggedout');
}

// ----- Settings: change password -----
let settingsModal=null;
function openSettings(){
 ['oldPw','newPw','newPw2'].forEach(id=>$(id).value=''); $('pwMsg').innerHTML='';
 settingsModal=settingsModal||new bootstrap.Modal($('settingsModal')); settingsModal.show();
}
$('pwForm').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const oldPassword=$('oldPw').value, newPassword=$('newPw').value, min=me.minPasswordLength||8;
 const fail=m=>{$('pwMsg').innerHTML='<div class="alert alert-danger py-2 small mb-0">'+esc(m)+'</div>'};
 if(!oldPassword)return fail('Enter your current password.');
 if(newPassword.length<min)return fail('New password must be at least '+min+' characters.');
 if(newPassword!==$('newPw2').value)return fail('The new passwords do not match.');
 $('pwBtn').disabled=true;
 try{
  const r=await api('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword,newPassword})});
  const b=await r.json().catch(()=>({}));
  if(!r.ok)return fail(b.message||('HTTP '+r.status));
  setToken(b.token);   // the change ends the old session; continue with the new token
  $('pwMsg').innerHTML='<div class="alert alert-success py-2 small mb-0">Password changed.</div>';
  ['oldPw','newPw','newPw2'].forEach(id=>$(id).value='');
  log('Password changed.');
 }catch(e){ if(!redirecting)fail(e.message) }
 finally{$('pwBtn').disabled=false}
});

// ----- SuperAdmin: users -----
let usersModal=null;
function openUsers(){
 $('tempPw').innerHTML=''; $('usersMsg').innerHTML='';
 usersModal=usersModal||new bootstrap.Modal($('usersModal')); usersModal.show(); loadUsers();
}
function fmtTime(x){return x?new Date(x).toLocaleString():'-'}
async function errText(r){const b=await r.json().catch(()=>({}));return b.message||('HTTP '+r.status)}
function usersMsg(kind,m){$('usersMsg').innerHTML='<div class="alert alert-'+kind+' py-2 small">'+esc(m)+'</div>'}
async function loadUsers(){
 try{
  const r=await api('/api/admin/users'); if(!r.ok)throw new Error(await errText(r));
  const list=await r.json();
  $('usersTable').innerHTML=list.map(u=>{
   const self=u.username.toLowerCase()===me.username.toLowerCase();
   const status=(u.active?'<span class="badge text-bg-success">ACTIVE</span>':'<span class="badge text-bg-secondary">DEACTIVATED</span>')
    +(u.mustChangePassword?' <span class="badge text-bg-warning" title="Must change password at next login">TEMP PASSWORD</span>':'')
    +(u.resetRequestedAt?' <span class="badge text-bg-danger" title="Requested via Forgot password? at '+esc(fmtTime(u.resetRequestedAt))+'">RESET REQUESTED</span>':'');
   const arg=esc(JSON.stringify(u.username));
   const actions='<button class="btn btn-sm btn-outline-primary me-1" onclick="resetUserPassword('+arg+')">Reset password</button>'
    +(self?'':(u.active?'<button class="btn btn-sm btn-outline-danger" onclick="setUserActive('+arg+',false)">Deactivate</button>'
                       :'<button class="btn btn-sm btn-outline-success" onclick="setUserActive('+arg+',true)">Activate</button>'));
   return '<tr><td><strong>'+esc(u.username)+'</strong>'+(self?' <span class="text-muted small">(you)</span>':'')+'</td><td>'+esc(u.role)+'</td><td>'+status
    +'</td><td class="small">'+esc(fmtTime(u.lastLogin))+'</td><td class="small">'+esc(fmtTime(u.createdAt))+(u.createdBy?' by '+esc(u.createdBy):'')
    +'</td><td class="text-end text-nowrap">'+actions+'</td></tr>';
  }).join('');
 }catch(e){ if(!redirecting)usersMsg('danger',e.message) }
}
function showTempPassword(t,what){
 $('usersMsg').innerHTML='';
 $('tempPw').innerHTML='<div class="alert alert-success"><div>'+esc(what)+' Give these credentials to the user. The temporary password is shown only once; the user must change it at first login.</div>'
  +'<div class="mt-2">Username: <strong>'+esc(t.username)+'</strong> &nbsp; Temporary password: <span class="temp-pw" id="tempPwValue">'+esc(t.temporaryPassword)+'</span>'
  +' <button class="btn btn-sm btn-outline-secondary ms-2" type="button" onclick="copyTempPw()">Copy</button></div></div>';
}
async function copyTempPw(){try{await navigator.clipboard.writeText($('tempPwValue').textContent)}catch(e){}}
$('createUserForm').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const username=$('newUsername').value.trim(), role=$('newRole').value;
 if(!username){usersMsg('danger','Enter a username.');return}
 try{
  const r=await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,role})});
  if(!r.ok){usersMsg('danger',await errText(r));return}
  showTempPassword(await r.json(),'User created.'); $('newUsername').value=''; loadUsers();
 }catch(e){ if(!redirecting)usersMsg('danger',e.message) }
});
async function resetUserPassword(username){
 if(!confirm('Generate a new temporary password for '+username+'? Their current password and sessions stop working.'))return;
 try{
  const r=await api('/api/admin/users/'+encodeURIComponent(username)+'/reset-password',{method:'POST'});
  if(!r.ok){usersMsg('danger',await errText(r));return}
  showTempPassword(await r.json(),'Password reset.'); loadUsers();
 }catch(e){ if(!redirecting)usersMsg('danger',e.message) }
}
async function setUserActive(username,active){
 if(!active&&!confirm('Deactivate '+username+'? They will be signed out and unable to log in.'))return;
 try{
  const r=active?await api('/api/admin/users/'+encodeURIComponent(username)+'/activate',{method:'POST'})
                :await api('/api/admin/users/'+encodeURIComponent(username),{method:'DELETE'});
  if(!r.ok){usersMsg('danger',await errText(r));return}
  $('tempPw').innerHTML=''; usersMsg('success',username+(active?' activated.':' deactivated.')); loadUsers();
 }catch(e){ if(!redirecting)usersMsg('danger',e.message) }
}

init();
</script>
</body>
